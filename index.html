<script>

let supervisor = localStorage.getItem('yt_sup') || '';

const STORES = [
  'proyectos',
  'actividades',
  'evidencias',
  'hallazgos'
];

let idb = null;

let cache = {
  proyectos:[],
  actividades:[],
  evidencias:[],

};


/* =========================
   BASE DE DATOS
========================= */

function openIDB(){

  return new Promise((resolve,reject)=>{

    const request =
      indexedDB.open('YulitelDB',1);

    request.onupgradeneeded = function(e){

      const db = e.target.result;

      STORES.forEach(store=>{

        if(!db.objectStoreNames.contains(store)){

          db.createObjectStore(
            store,
            {keyPath:'id'}
          );

        }

      });

    };

    request.onsuccess = function(e){

      idb = e.target.result;

      resolve(idb);

    };

    request.onerror = function(){

      reject(request.error);

    };

  });

}


function idbGetAll(store){

  return new Promise((resolve,reject)=>{

    const tx =
      idb.transaction(store,'readonly');

    const req =
      tx.objectStore(store).getAll();

    req.onsuccess =
      ()=>resolve(req.result || []);

    req.onerror =
      ()=>reject(req.error);

  });

}


function idbPut(store,data){

  return new Promise((resolve,reject)=>{

    const tx =
      idb.transaction(store,'readwrite');

    tx.objectStore(store).put(data);

    tx.oncomplete =
      ()=>resolve();

    tx.onerror =
      ()=>reject(tx.error);

  });

}


function idbDel(store,id){

  return new Promise((resolve,reject)=>{

    const tx =
      idb.transaction(store,'readwrite');

    tx.objectStore(store).delete(id);

    tx.oncomplete =
      ()=>resolve();

    tx.onerror =
      ()=>reject(tx.error);

  });

}


async function refreshAll(){

  for(const store of STORES){

    cache[store] =
      await idbGetAll(store);

  }

}


/* =========================
   NAVEGACIÓN
========================= */

const tabs = [

  {
    id:'home',
    label:'Inicio',
    icon:'🏠'
  },

  {
    id:'proyectos',
    label:'Proyectos',
    icon:'📁'
  },

  {
    id:'actividades',
    label:'Actividades',
    icon:'🗓️'
  },

  {
    id:'evidencias',
    label:'Evidencias',
    icon:'📷'
  },

  {
    id:'hallazgos',
    label:'Hallazgos',
    icon:'⚠️'
  }

];


let tab = 'home';


function goTab(t,render=true){

  tab = t;

  if(render){

    render();

  }

}


function cerrarSesion(){

  localStorage.removeItem('yt_sup');

  location.reload();

}


function doLogin(){

  const name =
    document.getElementById('loginName')
      .value.trim();

  if(!name){

    alert('Escribe el nombre del supervisor.');

    return;

  }

  supervisor = name;

  localStorage.setItem(
    'yt_sup',
    supervisor
  );

  startApp();

}


async function startApp(){

  document.getElementById('login')
    .style.display='none';

  document.getElementById('app')
    .style.display='block';

  document.getElementById('who')
    .textContent =
      'Supervisor: ' + supervisor;

  await openIDB();

  await refreshAll();

  render();

}


function renderNav(){

  const nav =
    document.getElementById('nav');

  nav.innerHTML =
    tabs.map(t=>`

      <button
        class="${tab===t.id?'active':''}"
        onclick="goTab('${t.id}')"
      >

        <span>${t.icon}</span>

        ${t.label}

      </button>

    `).join('');

}


function switchTab(){

  renderNav();

}


function fmtDate(date){

  if(!date) return '';

  return new Date(date)
    .toLocaleDateString('es-CO');

}


function semColor(value){

  if(value==='Verde')
    return 'ok';

  if(value==='Amarillo')
    return 'warn';

  if(value==='Rojo')
    return 'bad';

  return 'blue';

}


function newId(){

  return Date.now().toString()
    + Math.random()
      .toString(36)
      .slice(2,8);

}


/* =========================
   RENDER GENERAL
========================= */

function render(){

  const main =
    document.getElementById('main');

  if(tab==='home')
    main.innerHTML=viewHome();

  else if(tab==='proyectos')
    main.innerHTML=viewProyectos();

  else if(tab==='actividades')
    main.innerHTML=viewActividades();

  else if(tab==='evidencias')
    main.innerHTML=viewEvidencias();

  else if(tab==='hallazgos')
    main.innerHTML=viewHallazgos();

  else if(tab==='filtro')
    main.innerHTML=viewFiltro();

  renderNav();

}

function viewProyectos(){

  return `

    <button
      class="back"
      onclick="goTab('home')"
    >
      ← Volver al inicio
    </button>

    <h2>📁 Proyectos</h2>


    <div class="form">

      <h3>Registrar proyecto</h3>

      <label>Código del proyecto</label>

      <input id="p-codigo"
             placeholder="Ej. PRJ-001">


      <label>Nombre del proyecto</label>

      <input id="p-nombre"
             placeholder="Nombre del proyecto">


      <label>UIP</label>

      <input id="p-uip"
             placeholder="Unidad de Infraestructura de Proyecto">


      <label>Municipio</label>

      <input id="p-mun"
             placeholder="Municipio">


      <label>Fecha de inicio</label>

      <input id="p-fi"
             type="date">


      <label>Fecha final</label>

      <input id="p-ff"
             type="date">


      <label>Días de atraso</label>

      <input id="p-atraso"
             type="number"
             min="0"
             value="0">


      <button
        class="save"
        onclick="saveProyecto()"
      >
        Guardar proyecto
      </button>

    </div>


    <h3>Proyectos registrados</h3>

    ${
      cache.proyectos.length
      ?
      cache.proyectos.map(p=>`

        <div class="card">

          <strong>
            ${p.codigo || 'Sin código'}
          </strong>

          <p>
            ${p.nombre || ''}
          </p>

          <span class="pill blue">
            UIP: ${p.uip || 'N/D'}
          </span>

          <span class="pill blue">
            ${p.municipio || 'N/D'}
          </span>

          <p class="small">
            Inicio: ${p.fi || 'N/D'}<br>
            Fin: ${p.ff || 'N/D'}<br>
            Atraso: ${p.atraso || 0} días
          </p>

          <button
            class="delete"
            onclick="delDoc('proyectos','${p.id}')"
          >
            Eliminar
          </button>

        </div>

      `).join('')

      :

      `<div class="empty">
        No hay proyectos registrados.
      </div>`

    }

  `;

}


async function saveProyecto(){

  const data={

    id:newId(),

    codigo:v('p-codigo'),

    nombre:v('p-nombre'),

    uip:v('p-uip'),

    municipio:v('p-mun'),

    fi:v('p-fi'),

    ff:v('p-ff'),

    atraso:Number(
      v('p-atraso') || 0
    ),

    creado:Date.now()

  };


  if(!data.codigo ||
     !data.nombre){

    alert(
      'Completa el código y el nombre del proyecto.'
    );

    return;

  }


  await idbPut(
    'proyectos',
    data
  );

  await refreshAll();

  alert('Proyecto guardado correctamente.');

  render();

}

async function addEvPhoto(files){

  if(!files || !files.length)
    return;

  for(const file of files){

    await overlayAndPush(file);

  }

  const preview =
    document.getElementById('ev-preview');

  if(preview){

    preview.innerHTML =
      evState.fotos.map(f=>`

        <img
          src="${f.data}"
          class="photo-preview"
        >

      `).join('');

  }

}


function overlayAndPush(file){

  return new Promise(resolve=>{

    const reader =
      new FileReader();

    reader.onload=function(){

      const img =
        new Image();

      img.onload=function(){

        const canvas =
          document.createElement('canvas');

        const max=1200;

        let w=img.width;
        let h=img.height;

        if(w>max){

          h=h*max/w;
          w=max;

        }

        canvas.width=w;
        canvas.height=h;

        const ctx =
          canvas.getContext('2d');

        ctx.drawImage(
          img,
          0,
          0,
          w,
          h
        );


        ctx.fillStyle=
          'rgba(15,37,64,.82)';

        ctx.fillRect(
          0,
          h-95,
          w,
          95
        );


        ctx.fillStyle='white';

        ctx.font='18px Arial';


        const fecha =
          new Date()
            .toLocaleString('es-CO');


        ctx.fillText(
          'Yulitel',
          20,
          h-65
        );

        ctx.fillText(
          fecha,
          20,
          h-40
        );

        ctx.fillText(
          supervisor,
          20,
          h-15
        );


        const data =
          canvas.toDataURL(
            'image/jpeg',
            .82
          );


        evState.fotos.push({

          data:data,

          nombre:file.name,

          fecha:Date.now()

        });


        resolve();

      };

      img.src=reader.result;

    };

    reader.readAsDataURL(file);

  });

}

      <label>
        Proyecto
      </label>

      <select id="filtro-proyecto">

        <option value="">
          Todos los proyectos
        </option>

        ${
          cache.proyectos.map(p=>`

            <option
              value="${p.id}"
              ${filtroState.proyecto===p.id?'selected':''}
            >
              ${p.codigo} - ${p.nombre}
            </option>

          `).join('')
        }

      </select>


      <label>
        Fecha
      </label>

      <input
        id="filtro-fecha"
        type="date"
        value="${filtroState.fecha}"
      >


      <div class="filter-actions">

        <button
          class="save"
          onclick="ejecutarFiltro()"
        >
          🔎 Buscar
        </button>

        <button
          class="save"
          style="background:#777"
          onclick="limpiarFiltro()"
        >
          Limpiar
        </button>

      </div>


      <!-- BOTÓN EXPORTAR EXCEL -->

      <button
        class="addbtn"
        style="background:#2F855A;margin-top:10px"
        onclick="exportarExcel()"
      >
        📊 Exportar a Excel
      </button>

    </div>


    <div class="result-count">

      ${resultados.length}
      resultado(s) encontrado(s).

    </div>


    <div id="resultados-filtro">

      ${renderResultadoFiltro(resultados)}

    </div>

  `;

}


function ejecutarFiltro(){

  filtroState={

    texto:
      document.getElementById(
        'filtro-texto'
      )?.value.trim() || '',

    tipo:
      document.getElementById(
        'filtro-tipo'
      )?.value || '',

    proyecto:
      document.getElementById(
        'filtro-proyecto'
      )?.value || '',

    fecha:
      document.getElementById(
        'filtro-fecha'
      )?.value || ''

  };


  render();

}


function limpiarFiltro(){

  filtroState={
    texto:'',
    tipo:'',
    proyecto:'',
    fecha:''
  };

  render();

}


function textoIncluye(obj,texto){

  if(!texto)
    return true;

  return JSON.stringify(obj)
    .toLowerCase()
    .includes(
      texto.toLowerCase()
    );

}


function fechaRegistro(obj){

  if(!obj)
    return '';

  if(obj.fecha)
    return obj.fecha;

  if(obj.creado){

    return new Date(obj.creado)
      .toISOString()
      .slice(0,10);

  }

  return '';

}


function proyectoDeEvidencia(e){

  const act =
    cache.actividades.find(
      a=>a.id===e.actividad
    );

  return act?.proyecto || '';

}


function filtrarInformacion(){

  const resultado=[];


  if(
    !filtroState.tipo ||
    filtroState.tipo==='proyecto'
  ){

    cache.proyectos.forEach(p=>{

      if(
        textoIncluye(p,filtroState.texto) &&
        (!filtroState.proyecto ||
         p.id===filtroState.proyecto) &&
        (!filtroState.fecha ||
         fechaRegistro(p)===filtroState.fecha)
      ){

        resultado.push({

          tipo:'proyecto',

          data:p,

          proyecto:p.id

        });

      }

    });

  }


  if(
    !filtroState.tipo ||
    filtroState.tipo==='actividad'
  ){

    cache.actividades.forEach(a=>{

      if(
        textoIncluye(a,filtroState.texto) &&
        (!filtroState.proyecto ||
         a.proyecto===filtroState.proyecto) &&
        (!filtroState.fecha ||
         fechaRegistro(a)===filtroState.fecha)
      ){

        resultado.push({

          tipo:'actividad',

          data:a,

          proyecto:a.proyecto

        });

      }

    });

  }


  if(
    !filtroState.tipo ||
    filtroState.tipo==='evidencia'
  ){

    cache.evidencias.forEach(e=>{

      const proyecto =
        proyectoDeEvidencia(e);


      if(
        textoIncluye(e,filtroState.texto) &&
        (!filtroState.proyecto ||
         proyecto===filtroState.proyecto) &&
        (!filtroState.fecha ||
         fechaRegistro(e)===filtroState.fecha)
      ){

        resultado.push({

          tipo:'evidencia',

          data:e,

          proyecto:proyecto

        });

      }

    });

  }


  if(
    !filtroState.tipo ||
    filtroState.tipo==='hallazgo'
  ){

    cache.hallazgos.forEach(h=>{

      if(
        textoIncluye(h,filtroState.texto) &&
        (!filtroState.proyecto ||
         h.proyecto===filtroState.proyecto) &&
        (!filtroState.fecha ||
         fechaRegistro(h)===filtroState.fecha)
      ){

        resultado.push({

          tipo:'hallazgo',

          data:h,

          proyecto:h.proyecto

        });

      }

    });

  }


  return resultado;

}


function renderResultadoFiltro(resultados){

  if(!resultados.length){

    return `

      <div class="empty">

        No se encontraron resultados.

      </div>

    `;

  }


  return resultados.map(r=>{

    const d=r.data;


    if(r.tipo==='proyecto'){

      return `

        <div class="card">

          <span class="pill blue">
            📁 Proyecto
          </span>

          <h3>
            ${d.codigo || ''}
          </h3>

          <p>
            ${d.nombre || ''}
          </p>

          <p class="small">
            Municipio:
            ${d.municipio || 'N/D'}
            <br>
            UIP:
            ${d.uip || 'N/D'}
            <br>
            Inicio:
            ${d.fi || 'N/D'}
            <br>
            Fin:
            ${d.ff || 'N/D'}
          </p>

        </div>

      `;

    }


    if(r.tipo==='actividad'){

      const p =
        cache.proyectos.find(
          x=>x.id===d.proyecto
        );


      return `

        <div class="card">

          <span class="pill blue">
            🗓️ Actividad
          </span>

          <h3>
            ${d.nombre || ''}
          </h3>

          <p>
            Proyecto:
            ${p?.nombre || 'N/D'}
          </p>

          <p class="small">
            Fecha:
            ${d.fecha || 'N/D'}
            <br>
            Estado:
            ${d.estado || 'N/D'}
          </p>

        </div>

      `;

    }


    if(r.tipo==='evidencia'){

      const a =
        cache.actividades.find(
          x=>x.id===d.actividad
        );


      return `

        <div class="card">

          <span class="pill blue">
            📷 Evidencia
          </span>

          <h3>
            ${a?.nombre || 'Evidencia'}
          </h3>

          <p>
            ${d.desc || 'Sin descripción'}
          </p>

          <p class="small">
            Registrado por:
            ${d.registradoPor || 'N/D'}
            <br>
            Fotos:
            ${d.fotos?.length || 0}
          </p>

        </div>

      `;

    }


    if(r.tipo==='hallazgo'){

      return `

        <div class="card">

          <span class="pill ${semColor(d.semaforo)}">
            ⚠️ ${d.semaforo || 'Hallazgo'}
          </span>

          <h3>
            ${d.tipo || 'Hallazgo'}
          </h3>

          <p>
            ${d.desc || ''}
          </p>

          <p class="small">
            Severidad:
            ${d.sev || 'N/D'}
            <br>
            Registrado por:
            ${d.registradoPor || 'N/D'}
          </p>

        </div>

      `;

    }


    return '';

  }).join('');

}


/* ==================================================
   EXPORTAR A EXCEL
================================================== */

function exportarExcel(){

  /*
    Tomamos los filtros que estén actualmente
    escritos en pantalla.
  */

  filtroState={

    texto:
      document.getElementById(
        'filtro-texto'
      )?.value.trim() || '',

    tipo:
      document.getElementById(
        'filtro-tipo'
      )?.value || '',

    proyecto:
      document.getElementById(
        'filtro-proyecto'
      )?.value || '',

    fecha:
      document.getElementById(
        'filtro-fecha'
      )?.value || ''

  };


  /*
    Aplicamos los mismos filtros
    que utiliza HU-12.
  */

  const resultados =
    filtrarInformacion();


  /*
    Verificamos si existe información.
  */

  if(!resultados.length){

    alert(
      'No hay información para exportar con los filtros seleccionados.'
    );

    return;

  }


  /*
    Verificamos que Excel esté disponible.
  */

  if(typeof XLSX==='undefined'){

    alert(
      'No se pudo cargar la herramienta de Excel. Verifica tu conexión a Internet e inténtalo nuevamente.'
    );

    return;

  }


  /*
    Creamos el libro de Excel.
  */

  const wb =
    XLSX.utils.book_new();


  /* =========================
     HOJA PROYECTOS
  ========================= */

  const proyectos=[];


  resultados
    .filter(
      r=>r.tipo==='proyecto'
    )
    .forEach(r=>{

      const p=r.data;


      proyectos.push({

        'Código':
          p.codigo || '',

        'Nombre':
          p.nombre || '',

        'UIP':
          p.uip || '',

        'Municipio':
          p.municipio || '',

        'Fecha inicio':
          p.fi || '',

        'Fecha fin':
          p.ff || '',

        'Días de atraso':
          p.atraso || 0,

        'Estado':
          p.atraso>0
            ?'Con atraso'
            :'A tiempo'

      });

    });


  if(proyectos.length){

    const ws =
      XLSX.utils.json_to_sheet(
        proyectos
      );

    XLSX.utils.book_append_sheet(
      wb,
      ws,
      'Proyectos'
    );

  }


  /* =========================
     HOJA ACTIVIDADES
  ========================= */

  const actividades=[];


  resultados
    .filter(
      r=>r.tipo==='actividad'
    )
    .forEach(r=>{

      const a=r.data;


      const proyecto =
        cache.proyectos.find(
          p=>p.id===a.proyecto
        );


      actividades.push({

        'Código proyecto':
          proyecto?.codigo || '',

        'Proyecto':
          proyecto?.nombre || '',

        'Actividad':
          a.nombre || '',

        'Fecha':
          a.fecha || '',

        'Estado':
          a.estado || '',

        'Supervisor':
          supervisor || ''

      });

    });


  if(actividades.length){

    const ws =
      XLSX.utils.json_to_sheet(
        actividades
      );

    XLSX.utils.book_append_sheet(
      wb,
      ws,
      'Actividades'
    );

  }


  /* =========================
     HOJA EVIDENCIAS
  ========================= */

  const evidencias=[];


  resultados
    .filter(
      r=>r.tipo==='evidencia'
    )
    .forEach(r=>{

      const e=r.data;


      const act =
        cache.actividades.find(
          a=>a.id===e.actividad
        );


      const proyecto =
        cache.proyectos.find(
          p=>p.id===act?.proyecto
        );


      evidencias.push({

        'Código proyecto':
          proyecto?.codigo || '',

        'Proyecto':
          proyecto?.nombre || '',

        'Actividad':
          act?.nombre || '',

        'Fecha y hora':
          e.creado
            ?new Date(e.creado)
              .toLocaleString('es-CO')
            :'',

        'Registrado por':
          e.registradoPor || '',

        'Latitud':
          e.latitude ?? '',

        'Longitud':
          e.longitude ?? '',

        'Comentarios':
          e.desc || '',

        'Cantidad de fotos':
          e.fotos?.length || 0

      });

    });


  if(evidencias.length){

    const ws =
      XLSX.utils.json_to_sheet(
        evidencias
      );

    XLSX.utils.book_append_sheet(
      wb,
      ws,
      'Evidencias'
    );

  }


  /* =========================
     HOJA HALLAZGOS
  ========================= */

  const hallazgos=[];


  resultados
    .filter(
      r=>r.tipo==='hallazgo'
    )
    .forEach(r=>{

      const h=r.data;


      const proyecto =
        cache.proyectos.find(
          p=>p.id===h.proyecto
        );


      hallazgos.push({

        'Código proyecto':
          proyecto?.codigo || '',

        'Proyecto':
          proyecto?.nombre || '',

        'Tipificación':
          h.tipo || '',

        'Sub-estado':
          h.sub || '',

        'Severidad':
          h.sev || '',

        'Estado':
          h.semaforo || '',

        'Descripción':
          h.desc || '',

        'Registrado por':
          h.registradoPor || '',

        'Fecha y hora':
          h.creado
            ?new Date(h.creado)
              .toLocaleString('es-CO')
            :'',

        'Latitud':
          h.latitude ?? '',

        'Longitud':
          h.longitude ?? '',

        'Origen':
          h.origen || '',

        'Tiene fotografía':
          h.foto
            ?'Sí'
            :'No'

      });

    });


  if(hallazgos.length){

    const ws =
      XLSX.utils.json_to_sheet(
        hallazgos
      );

    XLSX.utils.book_append_sheet(
      wb,
      ws,
      'Hallazgos'
    );

  }


  /* =========================
     HOJA RESUMEN
  ========================= */

  const resumen=[

    {
      'Tipo':'Proyectos',
      'Cantidad':
        resultados.filter(
          r=>r.tipo==='proyecto'
        ).length
    },

    {
      'Tipo':'Actividades',
      'Cantidad':
        resultados.filter(
          r=>r.tipo==='actividad'
        ).length
    },

    {
      'Tipo':'Evidencias',
      'Cantidad':
        resultados.filter(
          r=>r.tipo==='evidencia'
        ).length
    },

    {
      'Tipo':'Hallazgos',
      'Cantidad':
        resultados.filter(
          r=>r.tipo==='hallazgo'
        ).length
    },

    {
      'Tipo':'Total de registros',
      'Cantidad':
        resultados.length
    }

  ];


  const wsResumen =
    XLSX.utils.json_to_sheet(
      resumen
    );


  XLSX.utils.book_append_sheet(
    wb,
    wsResumen,
    'Resumen'
  );


  /* =========================
     AJUSTAR COLUMNAS
  ========================= */

  wb.SheetNames.forEach(nombre=>{

    const ws =
      wb.Sheets[nombre];


    if(!ws['!ref'])
      return;


    const rango =
      XLSX.utils.decode_range(
        ws['!ref']
      );


    const anchos=[];


    for(
      let c=rango.s.c;
      c<=rango.e.c;
      c++
    ){

      let max=10;


      for(
        let f=rango.s.r;
        f<=rango.e.r;
        f++
      ){

        const celda =
          ws[
            XLSX.utils.encode_cell({
              r:f,
              c:c
            })
          ];


        if(celda){

          max=Math.max(
            max,
            String(
              celda.v ?? ''
            ).length
          );

        }

      }


      anchos.push({

        wch:
          Math.min(
            max+2,
            35
          )

      });

    }


    ws['!cols']=anchos;

  });


  /* =========================
     DESCARGAR ARCHIVO
  ========================= */

  const fecha =
    new Date()
      .toISOString()
      .slice(0,10);


  const nombreArchivo =
    `Yulitel_Reporte_${fecha}.xlsx`;


  XLSX.writeFile(
    wb,
    nombreArchivo
  );


  alert(
    'El reporte de Yulitel se exportó correctamente a Excel.'
  );

}


/* =========================
   HELPERS
========================= */

function v(id){

  return document
    .getElementById(id)
    ?.value
    ?.trim() || '';

}


function toggle(id){

  const el =
    document.getElementById(id);

  if(el){

    el.style.display =
      el.style.display==='none'
      ?'block'
      :'none';

  }

}


function clearForm(){

  document
    .querySelectorAll(
      '.form input, .form textarea'
    )
    .forEach(el=>{

      if(el.type!=='file')
        el.value='';

    });

}


async function delDoc(store,id){

  if(
    !confirm(
      '¿Deseas eliminar este registro?'
    )
  ){

    return;

  }


  await idbDel(
    store,
    id
  );


  await refreshAll();


  render();

}

   INICIAR APP
========================= */

if(supervisor){

  startApp();

}

</script>
